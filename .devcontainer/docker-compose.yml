services:
  api:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: py-scaffold-api
    command: ["uv", "run", "granian", "--interface", "asgi", "--host", "0.0.0.0", "--port", "1112", "main:app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
    networks:
      - backend
    ports:
      - "1112:1112"
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace

networks:
  backend:
    name: infra_backend
